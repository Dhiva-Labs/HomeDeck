name: home_deck
description: "Unified home control panel — Home Assistant, IoT and network devices, and any security camera, optimized for repurposed old phones and tablets."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  path_provider: ^2.1.6
  shared_preferences: ^2.3.0
  uuid: ^4.5.3
  http: ^1.2.0
  multicast_dns: ^0.3.2
  wakelock_plus: ^1.2.0
  url_launcher: ^6.3.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  easy_onvif: ^3.1.4
  web_socket_channel: ^3.0.0
  mqtt_client: ^10.0.0

  # Voice assistant
  porcupine_flutter: ^3.0.2
  sherpa_onnx: ^1.10.30
  record: ^6.1.0
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/kws/
