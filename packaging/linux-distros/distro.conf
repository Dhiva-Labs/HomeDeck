# Package metadata for the other-distribution packages (.rpm, Arch, AppImage,
# AUR PKGBUILD). Sourced by bash from packaging/linux-distros/pack.sh,
# verify.sh and packaging/arch/aur.sh. HomeDeck has no .deb: make-tree.sh
# builds the installed tree from the release tarball.

NAME=homedeck
APP_NAME=HomeDeck
GITHUB_REPO=Dhiva-Labs/HomeDeck
TAG_PREFIX=v
SUMMARY='Home control panel for Home Assistant, IoT and network devices, and cameras'
DESCRIPTION='HomeDeck connects to Home Assistant, to IoT devices directly (MQTT, Philips Hue), to plain network devices that are not smart at all, and to security cameras of any brand (ONVIF, RTSP), with an offline voice assistant that answers to a wake name you choose.'
MAINTAINER='Dhiva Labs <dhivakar1010@gmail.com>'
HOMEPAGE=https://github.com/Dhiva-Labs/HomeDeck
# The repository has no licence file, so no open-source licence is granted.
LICENSE=LicenseRef-Proprietary
LICENSE_FILE=''

# lib/libdartjni.so comes from the jni plugin (pulled in by the Android
# plugins). CMake found the runner's JDK, so it links libjvm.so with a RUNPATH
# into that JDK; no distribution resolves it, and the desktop app never loads
# it. No new format ships it.
EXCLUDE=(usr/lib/homedeck/lib/libdartjni.so)
PACKAGE_EXCLUDE=()

# The AUR package repackages the release tarball, which holds only the
# Flutter bundle; the desktop file and the icon come from the repository at
# the release tag.
AUR_SOURCES=(packaging/linux/homedeck.desktop app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png)

# rpm: libmpv.so.2()(64bit) (camera streams and media playback, linked by
# media_kit) and the GTK sonames are worked out from the ELF files. The voice
# assistant's wake word records through parecord and pactl (record_linux),
# so those are recommended.
# Flutter dlopens libEGL.so.1 and libGLESv2.so.2 (libepoxy), so they are no
# NEEDED entries; the rpm requires the sonames (libglvnd on Fedora, Mesa's
# libEGL1/libGLESv2-2 on openSUSE) and Arch gets libglvnd. Without them a
# minimal Fedora aborts at start with "Couldn't open libGLESv2.so.2".
RPM_REQUIRES=('libEGL.so.1()(64bit)' 'libGLESv2.so.2()(64bit)')
RPM_RECOMMENDS=(/usr/bin/parecord /usr/bin/pactl)
ARCH_DEPENDS=(gtk3 mpv libglvnd)
ARCH_OPTDEPENDS=('libpulse: wake-word listening (parecord, pactl)')
ARCH_INDEPENDENT=0

# AppImage: built from the tree bundle-libmpv.sh made self-contained (CI
# passes it as APPIMAGE_ROOT): libmpv and its chain, plus parecord and pactl
# under usr/lib/homedeck/tools/bin, which AppRun puts first on PATH.
APPIMAGE=1
EXEC=usr/lib/homedeck/home_deck
DESKTOP=usr/share/applications/homedeck.desktop
ICON=usr/share/icons/hicolor/192x192/apps/homedeck.png
APPRUN_ENV='export PATH="$here/usr/lib/homedeck/tools/bin:$PATH"'
APPIMAGE_HOST_PACKAGES_FEDORA='gtk3 libglvnd-egl libglvnd-gles mesa-libEGL mesa-libGL mesa-libgbm libdrm alsa-lib'

# Smoke test in each distribution container: the repository's own
# (app/tool/smoke_linux.sh, also run on the tarball): libapp.so and libmpv
# mapped into the running home_deck, and a screenshot of the window with the
# Flutter-rendered first screen in it.
GUI_CMD=homedeck
SMOKE_SCRIPT=app/tool/smoke_linux.sh
SMOKE_PACKAGES_FEDORA=ImageMagick
SMOKE_PACKAGES_SUSE=ImageMagick
SMOKE_PACKAGES_ARCH=imagemagick
SMOKE_SECONDS=90
SMOKE_CMD=''
